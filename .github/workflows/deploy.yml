name: Deploy
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo build
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo deployed to staging
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo deployed to production
